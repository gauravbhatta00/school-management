name: CI / CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel old runs on the same branch when a new push comes in
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────
#  JOB 1 — LINT
# ──────────────────────────────────────────
jobs:
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install black==23.9.1 flake8

      - name: black
        run: black --check backend

      - name: flake8
        run: flake8 --config .flake8 backend

# ──────────────────────────────────────────
#  JOB 2 — BACKEND TESTS
# ──────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run tests
        working-directory: backend
        run: pytest -q

# ──────────────────────────────────────────
#  JOB 3 — FRONTEND
# ──────────────────────────────────────────
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps --audit=false
          npm run build

# ──────────────────────────────────────────
#  JOB 4 — DEPLOY TO EC2
#  Runs ONLY on push to main/master
#  Waits for ALL 3 jobs above to pass
# ──────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [lint, backend, frontend]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    environment:
      name: production
      url: https://qubinery.space/

    steps:
      - name: SSH into EC2 & deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "📦 Pulling latest code..."
            cd ${{ secrets.APP_DIR }}
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "🐍 Installing Python dependencies..."
            if [ ! -d "venv" ]; then
              echo "Creating virtual environment..."
              sudo apt install python3.12-venv -y --quiet
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install -r backend/requirements.txt --quiet

            echo "🗄️ Running migrations..."
            cd backend
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            cd ..

            echo "🔄 Restarting server..."
            sudo systemctl restart gunicorn

            echo "✅ Deployed successfully!"

      - name: Smoke test
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}:8000/api/)
          echo "Health check status: $STATUS"
          [ "$STATUS" = "200" ] || [ "$STATUS" = "404" ] && echo "✅ App is live!" && exit 0
          echo "❌ Smoke test failed! Status: $STATUS"
          exit 1