services:
  # ── PostgreSQL database ────────────────────────────────────────────────────
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-school_management}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Unified Backend + Frontend Application ─────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-prod}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-YOUR_SERVER_IP,localhost,127.0.0.1,qubinery.space,www.qubinery.space}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://YOUR_SERVER_IP,https://qubinery.space,https://www.qubinery.space}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://YOUR_SERVER_IP,https://YOUR_SERVER_IP,https://qubinery.space,https://www.qubinery.space}
      VITE_API_URL: ${VITE_API_URL:-}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-school_management}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - app_data:/app/backend/data
      - media_vol:/app/backend/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  app_data:
  media_vol:
  pgdata:
