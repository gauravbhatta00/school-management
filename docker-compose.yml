services:
  # ── Unified Backend + Frontend Application (SQLite) ────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_ENV: ${DJANGO_ENV}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-YOUR_SERVER_IP,localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://YOUR_SERVER_IP,http://localhost,http://127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://YOUR_SERVER_IP,https://YOUR_SERVER_IP}
      VITE_API_URL: ${VITE_API_URL:-}
    volumes:
      - app_data:/app/backend/data
      - static_vol:/app/backend/static
      - media_vol:/app/backend/media
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  app_data:
  static_vol:
  media_vol:
